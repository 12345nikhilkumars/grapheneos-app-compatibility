# Google Pixel devices supported by GrapheneOS.
#
# Source: https://grapheneos.org/faq (device support section). Verified 2026-09-23.
# Re-verify against the FAQ when adding a device. GrapheneOS is Pixel-only.
#
# slug        - value used in app report frontmatter
# name        - display name
# codename    - Google's device codename
# generation  - Pixel generation number
# recommended - GrapheneOS "strongly recommends" this device
# mte         - hardware memory tagging, present from the 8th generation
# support_end - OEM minimum guaranteed support end date

