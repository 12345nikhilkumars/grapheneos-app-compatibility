# Countries with a board.
#
# code     - ISO 3166-1 alpha-2. The value used in app report frontmatter.
# name     - display name
# region   - grouping on the apps index
# order    - sort order within a region
# priority - surfaced first. India leads because the maintainer can verify
#            Indian apps hands-on, and because the UPI situation is contested
#            and needs first-hand testing.
#
# A country page is only generated if at least one app declares it. Adding a
# country here does not create an empty page.

- code: IN
  name: India
  region: Asia
  order: 1
  priority: true
- code: US
  name: United States
  region: Americas
  order: 1
  priority: false
