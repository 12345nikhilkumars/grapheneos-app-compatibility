baseURL = "https://12345nikhilkumars.github.io/grapheneos-app-compatibility/"
defaultContentLanguage = "en"
title = "GrapheneOS Info Board"
enableRobotsTXT = true

disableKinds = ["taxonomy", "term"]

[params]
  description = "Which apps work on GrapheneOS, and whether they can be fixed."
  repo = "https://github.com/12345nikhilkumars/grapheneos-app-compatibility"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "searchindex"]
  section = ["HTML"]

[outputFormats.feed]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

# Flat index of every app, fetched by the browser on first search keystroke.
# Emitted at /search-index.json.
[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true
